services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warpgate
      POSTGRES_PASSWORD: warpgate
      POSTGRES_DB: warpgate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
